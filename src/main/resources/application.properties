server.port=18632
server.address=0.0.0.0
spring.threads.virtual.enabled=true

# PROXY_API_KEY — пусто = без ключа (проверка на заголовок Authorization: Bearer <PROXY_API_KEY>)
proxy.api-key=${PROXY_API_KEY:}

# CORS_ORIGIN — пусто = CORS не настраивается (Разрешенные клиенты: http://localhost:1122, http://localhost:2233)
cors.origin=${CORS_ORIGIN:}

deepseek.base-url=https://chat.deepseek.com
deepseek.app-version=2.0.0
deepseek.completion-path=/api/v0/chat/completion
deepseek.chat-delete-path=/api/v0/chat_session/delete
deepseek.delete-chat=true
deepseek.default-model=deepseek-chat
# DEEPSEEK_RESPONSE_FORMAT — text|openai
deepseek.response-format=text
deepseek.retry-backoff-s=2
# DEEPSEEK_LOG_SSE — дамп SSE-событий в лог
deepseek.log-sse=false
deepseek.connect-timeout-ms=30000
# 0 — бесконечный SSE-стрим
deepseek.read-timeout-ms=0

# AUTH_DIR
auth.dir=${user.home}/.deepseek-free-api
# AUTH_INTERACTIVE_LOGIN
auth.interactive-login=true
# AUTH_REFRESH_INTERVAL_H
auth.refresh-interval-h=6
# AUTH_EMAIL (для CLI-режимов — DS_EMAIL)
auth.email=${AUTH_EMAIL:}
# AUTH_PASSWORD (для CLI-режимов — DS_PASSWORD)
auth.password=${AUTH_PASSWORD:}
# AUTH_HEADLESS_LOGIN_TIMEOUT_S (для CLI — HEADLESS_LOGIN_TIMEOUT_S)
auth.headless-login-timeout-s=${UTH_HEADLESS_LOGIN_TIMEOUT_S:60}

# PRIVACY_MASK_SECRETS — маскировать секреты в исходящем prompt
privacy.mask-secrets=${PRIVACY_MASK_SECRETS:true}
# PRIVACY_MASK_PATTERNS — доп. regex-шаблоны через запятую
privacy.mask-patterns=${PRIVACY_MASK_PATTERNS:}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-free-api"
version = "2.0.0"
description = "Бесплатный OpenAI-совместимый API через DeepSeek. Без API-ключей — только браузерная авторизация."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "playwright>=1.48",
    "pydantic>=2.9",
    "wasmtime>=25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[project.scripts]
deepseek-free-api = "deepseek_free_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: тесты, требующие сеть/живой аккаунт DeepSeek (пропускаются без --live)",
]

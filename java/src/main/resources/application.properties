server.port=18632
server.address=0.0.0.0
spring.threads.virtual.enabled=true

# PROXY_API_KEY — пусто = без ключа
proxy.api-key=

# CORS_ORIGIN — пусто = CORS не настраивается
cors.origin=

deepseek.base-url=https://chat.deepseek.com
deepseek.app-version=2.0.0
deepseek.completion-path=/api/v0/chat/completion
# DEEPSEEK_CHAT_DELETE_PATH (Python-эквивалент: DS_CHAT_DELETE_PATH)
deepseek.chat-delete-path=/api/v0/chat_session/delete
# DEEPSEEK_DELETE_CHAT (Python: DELETE_CHAT)
deepseek.delete-chat=true
# DEEPSEEK_DEFAULT_MODEL (Python: DEFAULT_MODEL)
deepseek.default-model=deepseek-chat
# DEEPSEEK_RESPONSE_FORMAT (Python: RESPONSE_FORMAT) — text|openai
deepseek.response-format=text
# DEEPSEEK_RETRY_BACKOFF_S (Python: RETRY_BACKOFF_S)
deepseek.retry-backoff-s=2
# DEEPSEEK_LOG_SSE — дамп SSE-событий в лог (Python: DEBUG)
deepseek.log-sse=false
deepseek.connect-timeout-ms=30000
# 0 — бесконечный SSE-стрим
deepseek.read-timeout-ms=0
# URL sha3_wasm_bg.wasm для кэширования в <auth.dir> (DEEPSEEK_SHA3_WASM — как в Python)
deepseek.pow-wasm-url=${DEEPSEEK_SHA3_WASM:https://fe-static.deepseek.com/chat/static/sha3_wasm_bg.7b9ca65ddd.wasm}

# AUTH_DIR
auth.dir=${user.home}/.deepseek-free-api
# AUTH_INTERACTIVE_LOGIN (Python: INTERACTIVE_LOGIN)
auth.interactive-login=true
# AUTH_REFRESH_INTERVAL_H (Python: REFRESH_INTERVAL_H)
auth.refresh-interval-h=6
# AUTH_EMAIL (для CLI-режимов — DS_EMAIL, как в Python)
auth.email=
# AUTH_PASSWORD (для CLI-режимов — DS_PASSWORD, как в Python)
auth.password=
# AUTH_HEADLESS_LOGIN_TIMEOUT_S (для CLI — HEADLESS_LOGIN_TIMEOUT_S, как в Python)
auth.headless-login-timeout-s=60

# PRIVACY_MASK_SECRETS — маскировать секреты в исходящем prompt
privacy.mask-secrets=true
# PRIVACY_MASK_PATTERNS — доп. regex-шаблоны через запятую
privacy.mask-patterns=
